name: Linux application

on:
  workflow_dispatch:
  push:
    tags: ['v*']
    branches: ['feat/**']
  pull_request:
    paths:
      - 'src/**'
      - 'dashboard/**'
      - 'packaging/**'
      - 'tests/**'
      - 'docs/getting-started/linux.md'
      - 'docs/development/linux-builds.md'
      - 'pyproject.toml'
      - '.github/workflows/linux.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13.5'
          cache: pip
          cache-dependency-path: packaging/requirements.lock
      - name: Install build and GUI verification tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends tk8.6 xvfb xauth xdg-utils desktop-file-utils
      - name: Install locked build dependencies
        run: |
          python -m pip install --require-hashes -r packaging/requirements.lock
          python -m pip install --no-deps --no-build-isolation -e .
      - name: Run regression tests
        run: python -m pytest -q --junitxml=build/test-results/pytest.xml
      - name: Verify native Tk startup
        run: xvfb-run -a python -c "import tkinter as tk; root=tk.Tk(); tk.Label(root, text='GUI preflight').pack(); root.update(); root.destroy()"
      - name: Freeze shared desktop application
        run: python -m PyInstaller --noconfirm --clean packaging/desktop.spec
      - name: Verify frozen application lifecycle
        run: xvfb-run -a python packaging/verify.py dist/WerkelijkRendement/WerkelijkRendement --desktop
      - name: Package AppImage and portable archive
        run: |
          export SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)
          python packaging/package_linux.py
          desktop-file-validate dist/WerkelijkRendement.AppDir/tech.brouns.WerkelijkRendement.desktop
      - name: Verify final AppImage and archive without FUSE or Python in PATH
        run: |
          version=$(python -c "from importlib.metadata import version; print(version('box3-werkelijk-rendement'))")
          xvfb-run -a python packaging/verify.py "dist/WerkelijkRendement-$version-linux-x86_64.AppImage" --desktop
          mkdir -p build/archive-verification
          tar -xzf "dist/WerkelijkRendement-$version-linux-x86_64.tar.gz" -C build/archive-verification
          xvfb-run -a python packaging/verify.py build/archive-verification/WerkelijkRendement/AppRun --desktop
      - name: Preserve failed test and verification diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Linux-verification-logs
          path: |
            build/test-results/
            build/verification-logs/
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: Linux-beta
          path: |
            dist/*.AppImage
            dist/*.tar.gz
            dist/*.sha256
          if-no-files-found: error
