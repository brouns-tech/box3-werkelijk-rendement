name: Documentation

on:
  pull_request:
    paths: ['docs/**', 'README.md', 'CONTRIBUTING.md', 'zensical.toml', 'documentation/**', '.github/workflows/docs.yml']
  push:
    branches: ['main', 'feat/**']
    paths: ['docs/**', 'README.md', 'CONTRIBUTING.md', 'zensical.toml', 'documentation/**', '.github/workflows/docs.yml']
  workflow_dispatch:
    inputs:
      deploy:
        description: Publish to GitHub Pages (main only; requires Pages source set to GitHub Actions)
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install --require-hashes -r documentation/requirements.lock
      - run: python -m zensical build --clean --strict
      - uses: actions/upload-artifact@v4
        with:
          name: documentation-site
          path: site/
          if-no-files-found: error
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name == 'workflow_dispatch' && inputs.deploy && github.ref == 'refs/heads/main'
        with:
          path: site/

  deploy:
    if: github.event_name == 'workflow_dispatch' && inputs.deploy && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
