[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "box3-werkelijk-rendement"
version = "0.1.0"
description = "Dutch Box 3 actual vs fictitious return analysis from local PDFs"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
  "pandas>=2.0",
  "pypdf>=4.0",
  "streamlit>=1.50",
  "streamlit-explorer==0.1.0",
  "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
dev = [
  "build>=1.2",
  "pytest>=8.0",
]

[project.scripts]
wr = "wr.cli:main"
wr-desktop = "wr.desktop:main"

[tool.setuptools.packages.find]
where = ["src", "."]
include = ["wr*", "dashboard*"]
