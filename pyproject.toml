[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "box3-werkelijk-rendement"
version = "0.1.0"
description = "Dutch Box 3 actual vs fictitious return analysis from local PDFs"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "pypdf>=4.0",
  "streamlit>=1.32",
  "tomli>=2.0; python_version < '3.11'",
]

[project.scripts]
wr = "wr.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
